spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/varsity_connect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:baggetter23}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # container stays above our own 5 MB rule so the app decides the error
      max-file-size: 6MB
      max-request-size: 32MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:varsity-connect-local-dev-secret-that-is-at-least-32-chars-long}
    expiry-ms: ${JWT_EXPIRY:86400000}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  payment:
    mock-enabled: true
  matching:
    threshold: 0.55

logging:
  level:
    com.varsityconnect: INFO
    org.hibernate.SQL: WARN
